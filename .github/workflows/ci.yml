name: CI

'on':
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install CPU PyTorch (Ubuntu)
        if: runner.os == 'Linux'
        run: pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and dependencies
        run: pip install -e ".[dev]"

      - name: Run fast unit tests
        run: pytest -q tests/test_config.py tests/test_state.py tests/test_daemon.py tests/test_documents.py tests/test_env_and_ignores.py tests/test_cli_paths.py
