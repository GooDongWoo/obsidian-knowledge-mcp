services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - type: bind
        source: ${KNOWLEDGE_QDRANT_STORAGE:?KNOWLEDGE_QDRANT_STORAGE must point to Vault .knowledge/qdrant}
        target: /qdrant/storage
    deploy:
      resources:
        limits:
          memory: 4G
